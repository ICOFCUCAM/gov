name: CI

# Node 22 (LTS) everywhere; actions at their Node 24 majors. pnpm comes from
# corepack at the version pinned in each package.json's packageManager field.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  app-checks:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (ESLint, eslint.config.mjs)
        run: pnpm lint
      - name: Unit tests (vitest)
        run: pnpm test
      - name: No new raw colours in console code (tokens only)
        run: pnpm scan:colours

  dependency-audit:
    name: dependency audit (production, high and critical)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      # Fails on any high or critical advisory in production dependencies
      # (pnpm audit --prod) that is not recorded, with a reason and a review
      # date, in app/scripts/audit-accepted.json.
      - name: Audit production dependencies
        run: node scripts/audit-deps.mjs --json dependency-audit.json
      - name: Raise the findings as Update Center advisories (when a publisher is configured)
        if: always()
        env:
          CIVICOS_PUBLISHER_URL: ${{ secrets.CIVICOS_PUBLISHER_URL }}
          CIVICOS_PUBLISHER_TOKEN: ${{ secrets.CIVICOS_PUBLISHER_TOKEN }}
        run: |
          if [ -z "$CIVICOS_PUBLISHER_URL" ]; then echo "No publisher configured; skipped."; exit 0; fi
          node scripts/audit-deps.mjs --publish "$CIVICOS_PUBLISHER_URL" || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: app/dependency-audit.json
          if-no-files-found: ignore

  container-scan:
    name: container image scan (high and critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the app image
        run: docker build -t civicos-app:ci app
      # Trivy's own image, pinned by digest (0.65.0); the trivy-action tag this
      # job used no longer resolves. The scan reads the image through the
      # runner's Docker socket.
      - name: Scan the image (OS packages and Node modules)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table civicos-app:ci
      - name: Software bill of materials (CycloneDX)
        if: always()
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/out"
          aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --format cyclonedx --output /out/civicos-app.cdx.json civicos-app:ci
      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: civicos-app-sbom
          path: civicos-app.cdx.json
          if-no-files-found: ignore

  public-sites-audit:
    name: public sites audit (accessibility, links, budgets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Start the server
        # A production build enforces sign-in unless told otherwise (go-live review L-2). These
        # checks read the console as the demo session, so this server is started open on purpose.
        env:
          CIVICOS_AUTH: open
          CIVICOS_MODE: demo
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/setup > /dev/null && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1
      - name: Audit every public site in every design (WCAG 2.2 AA, links, budgets)
        run: pnpm audit:sites --report public-sites-audit.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-sites-audit
          path: app/public-sites-audit.json
          if-no-files-found: ignore

  console-accessibility-audit:
    name: console accessibility audit (WCAG 2.2 AA, skip links)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Start the server
        # A production build enforces sign-in unless told otherwise (go-live review L-2). These
        # checks read the console as the demo session, so this server is started open on purpose.
        env:
          CIVICOS_AUTH: open
          CIVICOS_MODE: demo
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/setup > /dev/null && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1
      - name: Audit the console, Update Center, admin and onboarding pages (WCAG 2.2 AA, skip links)
        run: pnpm audit:console --nation KEN --report console-audit.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-audit
          path: app/console-audit.json
          if-no-files-found: ignore

  console-smoke:
    name: console smoke tests and OGC API Features conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Start the server
        # A production build enforces sign-in unless told otherwise (go-live review L-2). These
        # checks read the console as the demo session, so this server is started open on purpose.
        env:
          CIVICOS_AUTH: open
          CIVICOS_MODE: demo
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/setup > /dev/null && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1
      - name: Console pages on desktop and phone (page errors, CSP, maps, layout)
        run: node scripts/smoke-console.mjs --base http://localhost:3000 --nation KEN --report console-smoke.json
      - name: OGC API Features Part 1 core checks
        run: node scripts/ogc-check.mjs --base http://localhost:3000 --report ogc-check.json
      - name: OGC CITE TEAM Engine (official executable test suite)
        # Advisory until the suite's optional classes are reviewed: the report is kept either way.
        continue-on-error: true
        run: |
          docker run -d --name teamengine --network host ogccite/ets-ogcapi-features10:latest
          for i in $(seq 1 60); do curl -sf http://localhost:8080/teamengine/ > /dev/null && break; sleep 3; done
          curl -sf -u ogctest:ogctest -H 'Accept: application/xml' \
            "http://localhost:8080/teamengine/rest/suites/ogcapi-features-1.0/run?iut=http://localhost:3000/api/twin/ogc" -o ogc-cite.xml
          ! grep -q 'status="FAIL"' ogc-cite.xml
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-smoke
          path: |
            app/console-smoke.json
            app/ogc-check.json
            app/ogc-cite.xml
          if-no-files-found: ignore

  postgres-backend:
    name: postgres backend (write-through, backups, restore drill)
    runs-on: ubuntu-latest
    # The app's *.integration.test.ts suites (CIVICOS_STATE=postgres: records
    # written through, documents, backups and restore, the restore drill with
    # a live event consumer) are skipped without TEST_DATABASE_URL; here each
    # creates and drops its own database on a throwaway Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Postgres backend suites
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm exec vitest run src/lib/data/repo src/lib/db

  substrate-tests:
    name: substrate SQL suite
    runs-on: ubuntu-latest
    # Always runs: a throwaway Postgres service container gets the Supabase
    # stand-ins (roles, auth.uid(), extensions, supabase_realtime) and every
    # migration in order, then every *_test.sql suite. When a migrated test
    # database is also configured (SUBSTRATE_TEST_DATABASE_URL), the suites
    # run against it too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply the stand-ins and every migration to the throwaway database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/migrate.sh
      - name: Run substrate regression suite (throwaway database)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh
      - name: Run substrate regression suite (configured test database, when set)
        env:
          DATABASE_URL: ${{ secrets.SUBSTRATE_TEST_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "no SUBSTRATE_TEST_DATABASE_URL secret; the throwaway run above covers the suite"
            exit 0
          fi
          bash supabase/tests/run.sh

  civic-api:
    name: civic-api typecheck + tests
    runs-on: ubuntu-latest
    services:
      # A throwaway database for the mirror store's integration test (test/prisma-store.integration.spec.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/civic-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node --test expands the quoted spec glob itself, which needs Node 21+.
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client (no database needed)
        run: pnpm exec prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Apply the migrations to the throwaway database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/civicapi
        run: pnpm exec prisma migrate deploy
      - name: Unit and integration tests (node --test)
        env:
          MIRROR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/civicapi
        run: pnpm test

  helm-chart:
    name: helm chart (lint, render, validate)
    runs-on: ubuntu-latest
    env:
      # helm is built from its tagged module (verified against the Go checksum
      # database); kubeconform is the release binary, checked against the
      # SHA-256 below (from the release's CHECKSUMS file).
      HELM_VERSION: v3.22.1
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
      - name: Install helm (pinned)
        run: |
          GOBIN="$HOME/.local/bin" go install "helm.sh/helm/v3/cmd/helm@${HELM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install kubeconform (pinned, SHA-256 checked)
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf kubeconform.tar.gz -C "$HOME/.local/bin" kubeconform
          rm kubeconform.tar.gz
      - name: Lint, render (defaults, every profile, production-like values) and validate
        run: bash infra/helm/check.sh
