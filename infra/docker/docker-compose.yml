# CivicOS — local sovereign stack.
# Brings up Postgres, NATS, Redis, the API, and the Next.js app (one state
# writer, file state on a volume, health-checked); optionally Prometheus and
# an OpenTelemetry Collector (profile observability).
# Mirrors the production topology at small scale (single-node).
#
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# Production replaces this with the Helm chart (infra/helm/civicos).

name: civicos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civicos
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civic -d civicos']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ['-js'] # JetStream for durable event streams
    ports: ['4222:4222']
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -qO- http://localhost:8222/ || true']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']

  api:
    build:
      context: ../../services/civic-api
      dockerfile: Dockerfile
    environment:
      PORT: '4000'
      DATABASE_URL: postgresql://civic:civic@postgres:5432/civicos?schema=public
      NATS_URL: nats://nats:4222
      CIVIC_CORS_ORIGINS: http://localhost:3000
      CIVIC_DEV_AUTH: '1'
      # A mirror of the platform (services/civic-api/README.md): writes are
      # forwarded to the app, its tables are fed from the app's events and
      # mirror feed once the key and secret below are issued in Integrations.
      CIVIC_API_MODE: forward
      CIVICOS_PLATFORM_URL: http://app:3000
      CIVICOS_MIRROR_KEY: ${CIVICOS_MIRROR_KEY:-}
      CIVICOS_MIRROR_WEBHOOK_SECRET: ${CIVICOS_MIRROR_WEBHOOK_SECRET:-}
    command: >
      sh -c "pnpm prisma migrate deploy && node dist/main.js"
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  app:
    build:
      context: ../../app
      dockerfile: Dockerfile
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      CIVIC_API_URL: http://api:4000/api
      # The platform keeps its state in files on the app-state volume; one app
      # instance is the state writer (lib/data/persist.ts holds a lock file and
      # refuses to overwrite newer state). Do not scale this service.
      CIVICOS_STATE: file
      CIVICOS_STATE_DIR: /data
      # Sign-in is enforced in this production image unless CIVICOS_AUTH=open
      # (go-live review L-2; lib/auth/mode.ts). Set CIVICOS_AUTH=open only for a
      # local demonstration: the server warns at start and every console page
      # shows a banner. For anything shared, set a real CIVICOS_SESSION_SECRET
      # of 32+ characters and sign in with the setup code below.
      CIVICOS_AUTH: ${CIVICOS_AUTH:-}
      # Proxies in front that append to X-Forwarded-For (review L-1): 0 when
      # browsers reach port 3000 directly; 1 behind the edge profile (nginx
      # below), and then do not publish port 3000.
      CIVICOS_TRUSTED_PROXIES: ${CIVICOS_TRUSTED_PROXIES:-0}
      CIVICOS_SESSION_SECRET: ${CIVICOS_SESSION_SECRET:-local-only-session-secret-change-me-0001}
      CIVICOS_CRON_SECRET: ${CIVICOS_CRON_SECRET:-local-only-cron-secret-change-me-0001}
      # One secret per purpose (the cron secret opens only /api/cron/*); empty = no machine caller for that purpose.
      CIVICOS_EXPORT_SECRET: ${CIVICOS_EXPORT_SECRET:-}
      CIVICOS_PUBLISHER_SECRET: ${CIVICOS_PUBLISHER_SECRET:-}
      CIVICOS_PROVISIONING_SECRET: ${CIVICOS_PROVISIONING_SECRET:-}
      # First administrator: the one-time setup code. Empty = the app writes one to its log at start
      # (docker compose logs app | grep -A3 "SETUP CODE").
      CIVICOS_SETUP_TOKEN: ${CIVICOS_SETUP_TOKEN:-}
      CIVICOS_METRICS_TOKEN: ${CIVICOS_METRICS_TOKEN:-local-only-metrics-token-change-me-0001}
      CIVICOS_INTERNAL_URL: http://localhost:3000
      CIVICOS_LOG_LEVEL: ${CIVICOS_LOG_LEVEL:-info}
      # Traces (app/src/lib/ops/otel.ts): off unless set. With the observability
      # profile, CIVICOS_OTEL_ENDPOINT=http://otel-collector:4318 sends them to the
      # collector below; only ever the nation's own collector.
      CIVICOS_OTEL_ENDPOINT: ${CIVICOS_OTEL_ENDPOINT:-}
    volumes: ['appstate:/data']
    ports: ['3000:3000']
    deploy:
      replicas: 1
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health?ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    depends_on:
      api: { condition: service_started }

  # Optional: the nation's own metrics collection (docker compose --profile observability up).
  # Prometheus scrapes /api/metrics with the metrics token; nothing leaves the host.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    environment:
      CIVICOS_METRICS_TOKEN: ${CIVICOS_METRICS_TOKEN:-local-only-metrics-token-change-me-0001}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics-token:/etc/prometheus/metrics-token:ro
      - promdata:/prometheus
    ports: ['9090:9090']
    depends_on:
      app: { condition: service_healthy }

  # Optional: an edge proxy with the global limits (docker compose --profile edge up;
  # then use http://localhost:8080). The compose equivalent of the Helm ingress
  # limits: per-address request rate and connections, body size per path group
  # (infra/docker/nginx-edge.conf, which also shows mutual TLS for federation).
  edge:
    image: nginx:1.27-alpine
    profiles: ['edge']
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ['8080:8080']
    depends_on:
      app: { condition: service_healthy }

  # Optional: the nation's own trace collector (same profile). Receives OTLP/HTTP
  # from the app on the compose network only (no published port) and keeps the
  # traces in a file on the otel volume (infra/docker/otel-collector.yaml).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - oteldata:/var/lib/otel

volumes:
  pgdata:
  appstate:
  promdata:
  oteldata:
