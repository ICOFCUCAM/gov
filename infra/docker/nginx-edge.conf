# Edge proxy for a local CivicOS stack (docker compose --profile edge up):
# the compose equivalent of the Helm ingress limits (values ingress.limits).
# Global limits per client address, then tighter ones and their own body
# sizes for the path groups that take files; the app adds its own limits per
# official behind it (app/src/lib/ops/rate-limit*.ts). Nothing here leaves the
# host. For TLS and mutual TLS on /api/federation/exchange see the comments at
# the end (app/src/lib/exchange/mtls.ts).

limit_req_zone  $binary_remote_addr zone=civicos_all:10m     rate=20r/s;
limit_req_zone  $binary_remote_addr zone=civicos_uploads:10m rate=2r/s;
limit_req_zone  $binary_remote_addr zone=civicos_imports:10m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=civicos_feeds:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=civicos_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream civicos_app { server app:3000; }

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 2m;
  limit_conn civicos_conn 20;

  # Next.js's internal subrequest header (CVE-2025-29927) and the client
  # certificate headers never come from outside.
  proxy_set_header x-middleware-subrequest "";
  proxy_set_header ssl-client-verify "";
  proxy_set_header ssl-client-subject-dn "";
  proxy_set_header ssl-client-cert "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location / {
    limit_req zone=civicos_all burst=100 nodelay;
    proxy_pass http://civicos_app;
  }

  # Boundary files (up to 100 MB, base64 in JSON) and district packs (60 MB).
  location ~ ^/api/(boundaries|map-pack)$ {
    client_max_body_size 140m;
    limit_req zone=civicos_uploads burst=10 nodelay;
    limit_conn civicos_conn 4;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://civicos_app;
  }

  # CSV runs (20 MB), site candidates (10 MB), site imports, XLIFF files.
  location ~ ^/api/(twin/sources/[^/]+/run|facilities/candidates|org/ministries/[^/]+/facilities/import|public-sites/[^/]+/translations/[^/]+/xliff)$ {
    client_max_body_size 25m;
    limit_req zone=civicos_imports burst=25 nodelay;
    limit_conn civicos_conn 6;
    proxy_read_timeout 120s;
    proxy_pass http://civicos_app;
  }

  # Connected case and site systems (2 MB and 4 MB a call).
  location ~ ^/api/org/ministries/[^/]+/(queue|facilities)/feed$ {
    client_max_body_size 5m;
    limit_req zone=civicos_feeds burst=50 nodelay;
    limit_conn civicos_conn 10;
    proxy_pass http://civicos_app;
  }
}

