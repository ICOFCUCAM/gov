# Small municipality (< 50k people). Single region, shared regional Postgres,
# minimal replicas. Operator: 1 part-time admin. Go-live target: ~14 days.
api:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 75 }
  resources:
    requests: { cpu: "150m", memory: "192Mi" }
    limits: { cpu: "500m", memory: "384Mi" }
app:
  replicas: 1
pdb:
  enabled: false
