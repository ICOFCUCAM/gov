{{- if .Values.security.networkPolicy }}
# Zero-trust default-deny + explicit allows. The API may talk to Postgres,
# NATS, and receive from the app/ingress. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicos-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicos-api-allow
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: civic-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: civic-app } }
        - namespaceSelector: { matchLabels: { role: ingress } }
      ports: [{ port: 4000 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: nats } } }]
      ports: [{ port: 4222 }]
    - to: [] # DNS
      ports: [{ port: 53, protocol: UDP }]
---
# The Next.js app: reached from the ingress; it reaches the nation's substrate
# (Supabase over HTTPS), the civic-api, and DNS. Without this policy the
# default deny above would cut the app off entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicos-app-allow
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: civic-app }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { role: ingress } }
      ports: [{ port: 3000 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: civic-api } } }]
      ports: [{ port: 4000 }]
    - to: [] # the substrate and other registered HTTPS hosts (narrow with an egress gateway per nation)
      ports: [{ port: 443 }]
    - to: [] # DNS
      ports: [{ port: 53, protocol: UDP }]
{{- end }}
