apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicos-api
  labels:
    app.kubernetes.io/name: civic-api
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: civic-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: civic-api }
    spec:
      # The API never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with (include "civicos.imagePullSecrets" .) }}{{ . | nindent 6 }}{{- end }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "civicos.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.api.image "tag" .Values.api.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 4000 }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.api.mirrorSecret }}
            - name: CIVICOS_MIRROR_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.mirrorSecret }}, key: CIVICOS_MIRROR_KEY } }
            - name: CIVICOS_MIRROR_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.api.mirrorSecret }}, key: CIVICOS_MIRROR_WEBHOOK_SECRET } }
            {{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # The root filesystem is read-only; temporary files go here.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: civicos-api
  labels:
    app.kubernetes.io/name: civic-api
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: civic-api }
  ports: [{ port: 4000, targetPort: 4000 }]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: civicos-api
  labels:
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: civicos-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: civicos-api
  labels:
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: civic-api }
{{- end }}
