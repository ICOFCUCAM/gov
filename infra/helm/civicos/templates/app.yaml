apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicos-app
  labels:
    app.kubernetes.io/name: civic-app
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: civic-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: civic-app }
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "civicos.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.app.image "tag" .Values.app.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: CIVIC_API_URL
              value: http://civicos-api:4000/api
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: civicos-app
spec:
  selector: { app.kubernetes.io/name: civic-app }
  ports: [{ port: 3000, targetPort: 3000 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicos
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: civicos-api, port: { number: 4000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: civicos-app, port: { number: 3000 } }
{{- end }}
