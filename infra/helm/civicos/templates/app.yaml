{{- /*
The Next.js app serves the platform: its pages and every /api route the
console, the public sites and the machine callers use (twin, facilities,
boundaries, auth, setup, Update Center, cron). It keeps its operational state
in memory and saves it through lib/data/persist.ts, which allows ONE writer:
until that state moves to a multi-writer store (architecture review R6) the
app runs a single replica, replaced with the Recreate strategy so two
writers never overlap during a rollout. A second instance would only be a
standby (it refuses changes and reports not ready), so the chart refuses
more than one replica unless app.allowMultipleWriters is set.

With app.state.mode=postgres (CIVICOS_STATE=postgres, DATABASE_URL from the
postgres secret) every store is kept per record in the database: the audit
chain, the twin, the facility register and the boundary versions in typed
tables, and every other store (nation profile, ministries, officials, Update
Center, public sites, scenarios, metrics, event outbox, signed heads …) as
per-record documents (civicos.record_doc). Every replica writes its changes
through, each in one transaction with its audit entry and an outbox row, and
follows the others (lib/data/repo/postgres.ts). Several replicas are allowed
then, and every one takes every change; the lease only names the replica
that makes the CloudEvents and signed heads, and passes on when it stops.
Rollouts may overlap.
*/ -}}
{{- $state := .Values.app.state | default dict }}
{{- $mode := $state.mode | default "supabase" }}
{{- if and (gt (int .Values.app.replicas) 1) (ne $mode "postgres") (not .Values.app.allowMultipleWriters) }}
{{- fail "app.replicas must be 1 unless app.state.mode is postgres: the platform state has a single writer (lib/data/persist.ts). With postgres, every store is per record and every replica takes changes (architecture review R6)." }}
{{- end }}
{{- $hpa := .Values.app.autoscaling | default dict }}
{{- if and $hpa.enabled (ne $mode "postgres") }}
{{- fail "app.autoscaling needs app.state.mode postgres: with file or supabase state the platform has a single writer (lib/data/persist.ts)." }}
{{- end }}
{{- $ro := ne (toString .Values.app.readOnlyRootFilesystem) "false" }}
{{- /* The platform's keys (lib/keys/custody.ts): always from existing Secrets. */}}
{{- $keys := .Values.app.keys | default dict }}
{{- $provider := $keys.provider | default "env" }}
{{- $enforce := eq (toString .Values.app.auth) "enforce" }}
{{- if not (has $provider (list "env" "vault" "kms-http")) }}
{{- fail "app.keys.provider must be env, vault or kms-http" }}
{{- end }}
{{- if eq $provider "env" }}
{{- if and $enforce $keys.allowDevelopmentKeys }}
{{- fail "app.keys.allowDevelopmentKeys is refused while app.auth is enforce: development keys are generated per process and leave second-step secrets unsealed" }}
{{- end }}
{{- if not $keys.allowDevelopmentKeys }}
{{- $_ := required "app.keys.existingSecret: name the Secret holding CIVICOS_DATA_KEK, CIVICOS_AUDIT_KEY, CIVICOS_EXCHANGE_KEY and CIVICOS_TOKEN_KEY (or set app.keys.provider to vault or kms-http)" $keys.existingSecret }}
{{- end }}
{{- end }}
{{- $vault := $keys.vault | default dict }}
{{- $kms := $keys.kms | default dict }}
{{- if eq $provider "vault" }}
{{- $_ := required "app.keys.vault.addr: the Vault / OpenBao address (https)" $vault.addr }}
{{- $_ := required "app.keys.vault.existingSecret: a Secret with CIVICOS_VAULT_TOKEN, or CIVICOS_VAULT_ROLE_ID and CIVICOS_VAULT_SECRET_ID" $vault.existingSecret }}
{{- if not (has ($vault.auth | default "token") (list "token" "approle")) }}
{{- fail "app.keys.vault.auth must be token or approle" }}
{{- end }}
{{- end }}
{{- if eq $provider "kms-http" }}
{{- $_ := required "app.keys.kms.url: the KMS shim's address (https)" $kms.url }}
{{- $_ := required "app.keys.kms.existingSecret: a Secret with CIVICOS_KMS_TOKEN" $kms.existingSecret }}
{{- end }}
{{- $keysCa := ternary $vault.caSecret (ternary $kms.caSecret "" (eq $provider "kms-http")) (eq $provider "vault") }}
{{- $anchors := and (eq $mode "file") ((.Values.app.anchors | default dict).enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicos-app
  labels:
    app.kubernetes.io/name: civic-app
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  {{- if not $hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  # The old pod stops (saving its state and giving up the writer's lease)
  # before the new one starts; never two writers at once. In postgres mode a
  # new pod takes changes beside the old one at once and takes the lease after it.
  strategy:
    type: {{ if eq $mode "postgres" }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels: { app.kubernetes.io/name: civic-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: civic-app }
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- with (include "civicos.imagePullSecrets" .) }}{{ . | nindent 6 }}{{- end }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      # Time for the final save and the lease release on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: {{ include "civicos.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.app.image "tag" .Values.app.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: CIVIC_API_URL
              value: http://civicos-api:4000/api
            # Access gate (app/src/middleware.ts): enforce requires a verified official for every non-public page, read and change.
            - name: CIVICOS_AUTH
              value: {{ .Values.app.auth | quote }}
            # What the installation is (lib/ops/mode.ts): production (no sample records), training or demo.
            - name: CIVICOS_MODE
              value: {{ .Values.app.mode | default "production" | quote }}
            # Proxies in front that append to X-Forwarded-For (the ingress): per-address limits count them from the right.
            - name: CIVICOS_TRUSTED_PROXIES
              value: {{ .Values.app.trustedProxies | default 0 | quote }}
            # Where the platform state is saved (lib/data/persist.ts): supabase, file or postgres.
            - name: CIVICOS_STATE
              value: {{ $mode | quote }}
            {{- if eq $mode "file" }}
            - name: CIVICOS_STATE_DIR
              value: /var/lib/civicos/state
            {{- end }}
            {{- if $anchors }}
            # The append-only audit anchor file, on its own volume outside the state (lib/audit/anchor.ts).
            - name: CIVICOS_AUDIT_ANCHOR_FILE
              value: /var/lib/civicos/anchors/platform-audit-heads.jsonl
            {{- end }}
            {{- if eq $mode "postgres" }}
            # The nation's Postgres: per-record tables (migration civicos_records) and the other stores' snapshots.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: {{ .Values.postgres.secretKey }} }
            # The write queue's journal: changes not yet committed survive a crash of the process.
            - name: CIVICOS_PG_JOURNAL_DIR
              value: /var/lib/civicos/journal
            {{- end }}
            # The middleware asks this same server who a session belongs to and whether it holds the writer's lease.
            - name: CIVICOS_INTERNAL_URL
              value: http://127.0.0.1:3000
            - name: CIVICOS_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_SESSION_SECRET }
            - name: CIVICOS_CRON_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_CRON_SECRET }
            # One secret per purpose (go-live review M-7): the cron secret opens only /api/cron/*.
            # Each is optional; a purpose without its secret accepts no machine caller.
            - name: CIVICOS_EXPORT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_EXPORT_SECRET, optional: true }
            - name: CIVICOS_PUBLISHER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_PUBLISHER_SECRET, optional: true }
            - name: CIVICOS_PROVISIONING_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_PROVISIONING_SECRET, optional: true }
            # The one-time code for creating the first administrator (go-live review C-1). Optional: without it the
            # server writes a code to its log at start. Remove it from the secret once the first account exists.
            - name: CIVICOS_SETUP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: CIVICOS_SETUP_TOKEN, optional: true }
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: NEXT_PUBLIC_SUPABASE_URL, optional: true }
            - name: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, optional: true }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.app.existingSecret }}, key: SUPABASE_SERVICE_ROLE_KEY, optional: true }
            {{- range list "CIVICOS_METRICS_TOKEN" "CIVICOS_OTEL_HEADERS" "CIVICOS_TSA_AUTH" "CIVICOS_AI_API_KEY" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.app.existingSecret }}, key: {{ . }}, optional: true }
            {{- end }}
            # Key custody (lib/keys/custody.ts): {{ $provider }}.
            - name: CIVICOS_KEY_PROVIDER
              value: {{ $provider | quote }}
            {{- if $keys.existingSecret }}
            {{- /* env: the keys are required (the pod does not start without them); remote: only the old KEK, if any, for values sealed before the move. */}}
            {{- $need := eq $provider "env" }}
            {{- range list "CIVICOS_DATA_KEK" "CIVICOS_AUDIT_KEY" "CIVICOS_EXCHANGE_KEY" "CIVICOS_TOKEN_KEY" }}
            {{- if or $need (eq . "CIVICOS_DATA_KEK") }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $keys.existingSecret }}, key: {{ . }}{{ if not $need }}, optional: true{{ end }} }
            {{- end }}
            {{- end }}
            - name: CIVICOS_DATA_KEK_PREVIOUS
              valueFrom:
                secretKeyRef: { name: {{ $keys.existingSecret }}, key: CIVICOS_DATA_KEK_PREVIOUS, optional: true }
            {{- end }}
            {{- if eq $provider "vault" }}
            - name: CIVICOS_VAULT_ADDR
              value: {{ $vault.addr | quote }}
            {{- with $vault.namespace }}
            - name: CIVICOS_VAULT_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            - name: CIVICOS_VAULT_TRANSIT_MOUNT
              value: {{ $vault.transitMount | default "transit" | quote }}
            {{- if eq ($vault.auth | default "token") "approle" }}
            - name: CIVICOS_VAULT_APPROLE_MOUNT
              value: {{ $vault.approleMount | default "approle" | quote }}
            {{- range list "CIVICOS_VAULT_ROLE_ID" "CIVICOS_VAULT_SECRET_ID" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $vault.existingSecret }}, key: {{ . }} }
            {{- end }}
            {{- else }}
            - name: CIVICOS_VAULT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $vault.existingSecret }}, key: CIVICOS_VAULT_TOKEN }
            {{- end }}
            {{- range $purpose, $name := $vault.keyNames }}
            - name: CIVICOS_VAULT_{{ upper $purpose }}_KEY
              value: {{ $name | quote }}
            {{- end }}
            {{- if $keysCa }}
            - name: CIVICOS_VAULT_CA
              value: /etc/civicos/keys-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if eq $provider "kms-http" }}
            - name: CIVICOS_KMS_URL
              value: {{ $kms.url | quote }}
            - name: CIVICOS_KMS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $kms.existingSecret }}, key: CIVICOS_KMS_TOKEN }
            {{- range $purpose, $name := $kms.keyNames }}
            - name: CIVICOS_KMS_{{ upper $purpose }}_KEY
              value: {{ $name | quote }}
            {{- end }}
            {{- if $keysCa }}
            - name: CIVICOS_KMS_CA
              value: /etc/civicos/keys-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- with .Values.ingress.federation }}
            {{- if .enabled }}
            # Exchanges between installations under mutual TLS: the federation
            # ingress host verifies client certificates and passes them on
            # (lib/exchange/mtls.ts believes those headers only on this host).
            - name: CIVICOS_TRUST_PROXY_CLIENT_CERT
              value: "1"
            - name: CIVICOS_FEDERATION_HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.app.federationClientSecret }}
            # This installation's client certificate for partners (lib/exchange/federation-client.ts).
            - name: CIVICOS_FEDERATION_CERT
              value: /etc/civicos/federation/tls.crt
            - name: CIVICOS_FEDERATION_KEY
              value: /etc/civicos/federation/tls.key
            - name: CIVICOS_FEDERATION_CA
              value: /etc/civicos/federation/ca.crt
            {{- end }}
            {{- if .Values.otel.enabled }}
            # Traces to the nation's own collector only (lib/ops/otel.ts).
            - name: CIVICOS_OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | default "http://civicos-otel-collector:4318" | quote }}
            - name: CIVICOS_OTEL_SAMPLE_RATIO
              value: {{ .Values.otel.sampleRatio | default "1" | quote }}
            {{- end }}
            {{- range $k, $v := .Values.app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
          # Starting may wait for a crashed writer's lease to run out (about 35 s).
          startupProbe:
            httpGet:
              path: /api/health?live
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
          # Ready only while this server holds the writer's lease and its state restored.
          readinessProbe:
            httpGet:
              path: /api/health?ready
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health?live
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $ro }}
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Temporary files and Next.js's runtime cache (the image's own
            # .next/cache is not writable by the app's user either way).
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
            {{- if $anchors }}
            - name: anchors
              mountPath: /var/lib/civicos/anchors
            {{- end }}
            {{- if $keysCa }}
            - name: keys-ca
              mountPath: /etc/civicos/keys-ca
              readOnly: true
            {{- end }}
            {{- if eq $mode "file" }}
            - name: state
              mountPath: /var/lib/civicos/state
            {{- end }}
            {{- if eq $mode "postgres" }}
            # The write-through journal (replayed after a crash) for the per-record tables.
            - name: journal
              mountPath: /var/lib/civicos/journal
            {{- end }}
            {{- if .Values.app.federationClientSecret }}
            - name: federation-client
              mountPath: /etc/civicos/federation
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: {{ .Values.app.tmpSize | default "512Mi" | quote }} }
        - name: next-cache
          emptyDir: { sizeLimit: {{ .Values.app.cacheSize | default "1Gi" | quote }} }
        {{- if $keysCa }}
        # The key provider's CA (ca.crt).
        - name: keys-ca
          secret:
            secretName: {{ $keysCa }}
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
        {{- if $anchors }}
        - name: anchors
          persistentVolumeClaim:
            claimName: {{ .Values.app.anchors.existingClaim | default "civicos-app-anchors" }}
        {{- end }}
        {{- if eq $mode "file" }}
        - name: state
          persistentVolumeClaim:
            claimName: civicos-app-state
        {{- end }}
        {{- if eq $mode "postgres" }}
        - name: journal
          emptyDir: {}
        {{- end }}
        {{- if .Values.app.federationClientSecret }}
        # A kubernetes.io/tls secret with tls.crt, tls.key and ca.crt (the partners' CA).
        - name: federation-client
          secret:
            secretName: {{ .Values.app.federationClientSecret }}
            defaultMode: 0400
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: civicos-app
  labels:
    app.kubernetes.io/name: civic-app
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: civic-app }
  ports: [{ port: 3000, targetPort: 3000 }]
{{- if eq ($state.mode | default "supabase") "file" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: civicos-app-state
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $state.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $state.size | default "5Gi" }}
{{- end }}
{{- if and $anchors (not .Values.app.anchors.existingClaim) }}
---
# The audit anchor file's own volume (file mode): kept when the release is
# removed, like the state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: civicos-app-anchors
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.app.anchors.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.app.anchors.size | default "1Gi" }}
{{- end }}
{{- if $hpa.enabled }}
---
# Several app replicas scaled on CPU (state.mode postgres only: every replica
# takes every change).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: civicos-app
  labels:
    {{- include "civicos.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: civicos-app
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.pdb.enabled }}
---
# One replica: a voluntary disruption (node drain) may take it down; the
# Recreate strategy and the writer's lease keep a second writer from starting
# until it has stopped.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: civicos-app
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: civic-app }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicos
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- with .Values.ingress.limits }}
    {{- if .enabled }}
    # Global limits per client address (values ingress.limits); the app adds its own per official.
    nginx.ingress.kubernetes.io/limit-rps: {{ .rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .connections | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .bodySize | quote }}
    {{- with .allowlist }}
    nginx.ingress.kubernetes.io/limit-allowlist: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.ingress.stripInternalHeaders }}
    # Next.js's internal subrequest header (CVE-2025-29927) never comes from
    # outside; drop it before it reaches the app (the app also refuses it).
    # Needs snippet annotations allowed on the controller; set
    # ingress.stripInternalHeaders=false where they are not.
    # The client-certificate headers are believed only from the federation host
    # (mutual TLS), so they are dropped here as well.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers "x-middleware-subrequest" "ssl-client-verify" "ssl-client-subject-dn" "ssl-client-issuer-dn" "ssl-client-cert";
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Every page and every /api route is the Next.js app's.
          - path: /
            pathType: Prefix
            backend:
              service: { name: civicos-app, port: { number: 3000 } }
{{- if .Values.ingress.civicApiPath }}
---
# The NestJS service (services/civic-api) keeps its own /api/* paths, served
# from {{ .Values.ingress.civicApiPath }}/* (rewritten to /api/*), since /api
# belongs to the app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicos-civic-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.civicApiPath }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: civicos-api, port: { number: 4000 } }
{{- end }}
{{- with .Values.ingress.limits }}
{{- if .enabled }}
{{- $limits := . }}
{{- range $name, $g := .groups }}
---
# Path group "{{ $name }}": its own body size and limits (values ingress.limits.groups).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicos-limits-{{ $name }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rps: {{ $g.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ $limits.burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ $g.connections | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $g.bodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $g.readTimeout | default 60 | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $g.readTimeout | default 60 | quote }}
    {{- with $limits.allowlist }}
    nginx.ingress.kubernetes.io/limit-allowlist: {{ . | quote }}
    {{- end }}
    {{- if $.Values.ingress.stripInternalHeaders }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers "x-middleware-subrequest" "ssl-client-verify" "ssl-client-subject-dn" "ssl-client-issuer-dn" "ssl-client-cert";
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ $.Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $.Values.ingress.host | quote }}
      http:
        paths:
          {{- range $g.paths }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service: { name: civicos-app, port: { number: 3000 } }
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.ingress.federation }}
{{- if .enabled }}
---
# Exchanges between installations (POST /api/federation/exchange) on their own
# host, under mutual TLS: ingress-nginx applies client-certificate checks to a
# whole host, so the partners' host is separate from the one browsers use.
# The partner's certificate must chain to the federation CA (caSecret, a
# secret with ca.crt); nginx passes the verified result and the certificate
# on, and the app matches its fingerprint against the grant
# (lib/exchange/mtls.ts). Nothing else is served on this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicos-federation
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .caSecret | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: {{ .verifyDepth | default 2 | quote }}
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: {{ .limitRps | default 10 | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .limitConnections | default 10 | quote }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts: [{{ .host | quote }}]
      secretName: {{ .tlsSecretName }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/federation/exchange
            pathType: Exact
            backend:
              service: { name: civicos-app, port: { number: 3000 } }
{{- end }}
{{- end }}
{{- end }}
